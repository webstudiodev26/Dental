1.5px solid rgba(15,59,60,.22)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 52px; line-height: 1; color: #7A5C33\">01<\/span><h3 style=\"font-size: 26px; color: #0F3B3C\">Gingivitis<\/h3><p style=\"font-size: 17px; color: #3A4543\">Upala desni: crvenilo, otok i krvarenje.<\/p><\/li><li class=\"rv\" style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 24px; border-top: 1.5px solid rgba(15,59,60,.22)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 52px; line-height: 1; color: #7A5C33\">02<\/span><h3 style=\"font-size: 26px; color: #0F3B3C\">Dublja tkiva<\/h3><p style=\"font-size: 17px; color: #3A4543\">Upala se širi na dublja potporna tkiva zuba.<\/p><\/li><li class=\"rv\" style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 24px; border-top: 1.5px solid rgba(15,59,60,.22)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 52px; line-height: 1; color: #7A5C33\">03<\/span><h3 style=\"font-size: 26px; color: #0F3B3C\">Klaćenje i gubitak zuba<\/h3><p style=\"font-size: 17px; color: #3A4543\">Bez lečenja bolest vodi klaćenju i gubitku zuba.<\/p><\/li><\/ol>\n<\/div>\n<\/section>\n\n<section style=\"background: #F7F3EC; padding: 120px 0\">\n<div class=\"wrap\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 72px; align-items: start\">\n<div class=\"rv\" style=\"display: flex; flex-direction: column; gap: 18px\"><span class=\"eyebrow\">Uzrok<\/span><h2 style=\"font-size: 52px; line-height: 1.05; color: #0F3B3C\">Kako nastaje paradentoza<\/h2><\/div>\n<div class=\"rv\" style=\"background: #FFFDF9; border-radius: 28px; padding: 40px; border: 1px solid rgba(15,59,60,.1); display: flex; flex-direction: column; gap: 16px\">\n<p style=\"font-size: 19px; line-height: 1.65; color: #2E3836\">Glavni uzrok je dentalni plak: bakterije i njihovi toksini oštećuju potporna tkiva zuba.<\/p>\n<p style=\"font-size: 19px; line-height: 1.65; color: #2E3836\" t width=\"3\" height=\"1.333\" fill=\"#0039A6\"><\/rect><rect width=\"3\" height=\"0.667\" fill=\"#FFFFFF\"><\/rect><\/svg><span>Русский<\/span><\/button><\/div><\/div>\n<\/nav>\n<\/sc-if>\n<\/header>\n\n<section class=\"px\" style=\"background: #F7F3EC; padding-top: 24px; padding-bottom: 48px; display: flex; flex-direction: column; gap: 18px\">\n<nav aria-label=\"Putanja\"><ol class=\"bc\" style=\"font-size: 14px\"><li><a href=\"../../\">Početna<\/a><\/li><li aria-hidden=\"true\"><span aria-hidden=\"true\" style=\"color: #C8A97E\">/<\/span><\/li><li><a href=\"../\">Usluge<\/a><\/li><li aria-hidden=\"true\"><span aria-hidden=\"true\" style=\"color: #C8A97E\">/<\/span><\/li><li aria-current=\"page\">Parodontologija<\/li><\/ol><\/nav>\n<span class=\"eyebrow\" style=\"margin-top: 8px\">Usluge<\/span>\n<h1 style=\"font-size: 38px; line-height: 1.06; color: #0F3B3C\">Parodontologija – lečenje paradentoze<\/h1>\n<p style=\"font-size: 17px; color: #2E3836\">Parodontologija se bavi sprečavanjem i lečenjem oboljenja potpornog aparata zuba. Paradentoza je, uz karijes, najrasprostranjenija bolest usne duplje i pogađa ljude svih uzrasta.<\/p>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<a class=\"btn btn-p\" href=\"../../kontakt/\">Zakažite pregled<\/a>\n<a class=\"btn btn-o\" href=\"tel:+381601111000\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z\"><\/path><\/svg>060 1111 000<\/a>\n<\/div>\n<ul style=\"display: flex; flex-wrap: wrap; gap: 8px\"><li class=\"badge\"><b>Konzervativno i hirurško lečenje<\/b><\/li><li class=\"badge\">Laserski tretman<\/li><li class=\"badge\">Za sve uzraste<\/li><\/ul>\n<img class=\"warm\" src=\"../../assets/3b3eab6136b6e88e8cbd55ac22d00506.webp\" alt=\"Parodontologija Beograd — pregled desni, poliklinika Dr Popović\" width=\"800\" height=\"530\" fetchpriority=\"high\" style=\"display: block; width: 100%; height: 280px; object-fit: cover; object-position: 40% 45%; border-radius: 24px 24px 24px 80px; margin-top: 8px; background: #E4DBCB\">\n<\/section>\n\n<section class=\"px\" style=\"background: #EFE8DC; padding-top: 64px; padding-bottom: 56px; display: flex; flex-direction: column; gap: 14px\">\n<span class=\"eyebrow\">O bolesti<\/span>\n<h2 style=\"font-size: 34px; line-height: 1.1; color: #0F3B3C\">Šta je paradentoza?<\/h2>\n<p style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21px; line-height: 1.4; color: #0F3B3C\">Paradentoza je progresivna bolest koja zahvata ceo potporni aparat zuba — desni, cement, periodoncijum i kost.<\/p>\n<ol style=\"margin: 8px 0 0; padding: 0; list-style: none\"><li style=\"display: flex; gap: 18px; padding: 18px 0; border-top: 1px solid rgba(15,59,60,.2)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 36px; line-height: 1; color: #7A5C33; width: 48px; flex-shrink: 0\">01<\/span><div style=\"display: flex; flex-direction: column; gap: 4px\"><h3 style=\"font-size: 21px; color: #0F3B3C\">Gingivitis<\/h3><p style=\"font-size: 16.5px; color: #3A4543\">Upala desni: crvenilo, otok i krvarenje.<\/p><\/div><\/li><li style=\"display: flex; gap: 18px; padding: 18px 0; border-top: 1px solid rgba(15,59,60,.2)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 36px; line-height: 1; color: #7A5C33; width: 48px; flex-shrink: 0\">02<\/span><div style=\"display: flex; flex-direction: column; gap: 4px\"><h3 style=\"font-size: 21px; color: #0F3B3C\">Dublja tkiva<\/h3><p style=\"font-size: 16.5px; color: #3A4543\">Upala se širi na dublja potporna tkiva zuba.<\/p><\/div><\/li><li style=\"display:
