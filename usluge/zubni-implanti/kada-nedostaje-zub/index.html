 #C8A97E\">/<\/span><\/li><li><a href=\"../../\">Usluge<\/a><\/li><li aria-hidden=\"true\"><span aria-hidden=\"true\" style=\"color: #C8A97E\">/<\/span><\/li><li><a href=\"../\">Zubni implanti<\/a><\/li><li aria-hidden=\"true\"><span aria-hidden=\"true\" style=\"color: #C8A97E\">/<\/span><\/li><li aria-current=\"page\">Jedan zub<\/li><\/ol><\/nav>\n<div style=\"display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 64px; align-items: center\">\n<div class=\"rv\" style=\"display: flex; flex-direction: column; gap: 24px\">\n<span class=\"eyebrow\">Zubni implanti<\/span>\n<h1 style=\"font-size: 72px; line-height: 1.02; color: #0F3B3C\">Kada nedostaje jedan zub<\/h1>\n<p style=\"font-size: 20px; line-height: 1.6; color: #2E3836\">Nedostatak jednog zuba nije samo estetski problem. Ako se ne reši, susedni zubi počinju da se pomeraju, zagrižaj se menja, a kost na mestu izgubljenog zuba se povlači.<\/p>\n<p style=\"font-size: 18px; line-height: 1.6; color: #2E3836\">Implant sa krunicom nadoknađuje zub u potpunosti, bez diranja zdravih susednih zuba. Ugradnju radi mr sci. med. Nemanja Popović, specijalista oralne hirurgije, sa Straumann i Neodent implantima koji imaju doživotnu garanciju proizvođača. U većini slučajeva privremenu krunicu dobijate istog dana.<\/p>\n<div style=\"display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px\">\n<a class=\"btn btn-p\" href=\"../../../kontakt/\">Zakažite pregled<\/a>\n<a class=\"btn btn-o\" href=\"tel:+381601111000\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z\"><\/path><\/svg>060 1111 000<\/a>\n<\/div>\n<ul style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px\">\n<li class=\"badge\"><b>Od 79.200 din sa krunicom<\/b><\/li>\n<li class=\"badge\">Bez brušenja zdravih zuba<\/li>\n<li class=\"badge\">Privremena krunica istog dana<\/li>\n<\/ul>\n<\/div>\n<img src=\"../../../assets/00041fbca30d0114febd3b090b46074a.webp\" alt=\"Nedostaje jedan zub — rešenje je implant sa krunicom, poliklinika Dr Popović\" width=\"742\" height=\"400\" style=\"display: block; width: 100%; height: 460px; border-radius: 32px 32px 32px 140px; object-fit: cover; object-position: 32% 50%\">\n<\/div>\n<\/div>\n<\/section>\n\n<section style=\"background: #EFE8DC; padding: 120px 0\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 48px\">\n<div class=\"rv\" style=\"display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; max-width: 820px; margin: 0 auto\">\n<span class=\"eyebrow\">Poređenje rešenja<\/span>\n<h2 style=\"font-size: 52px; line-height: 1.05; color: #0F3B3C\">Zašto je implant najčešće najbolje rešenje?<\/h2>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: stretch\">\n<div class=\"cmp rv\"><span style=\"align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #3A4543; padding: 6px 0\">Alternativa<\/span><h3 style=\"font-size: 30px; color: #0F3B3C\">Zubni most<\/h3><ul style=\"display: flex; flex-direction: column; gap: 12px; color: #2E3836\"><li><span aria-hidden=\"true\" style=\"flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: #9C7641; margin-top: 10px\"><\/span><span>Zahteva brušenje dva zdrava susedna zuba<\/span><\/li><li><span aria-hidden=\"true\" style=\"flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: #9C7641; margin-top: 10px\"><\/span><span>Ne sprečava povlačenje kosti, jer nema korena<\/span><\/li><\/ul><\/div>\n<div class=\"cmp rv\"><span style=\"align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #3A4543; padding: 6px 0\">Alternativa<\/span><h3 style=\"font-size: 30px; color: #0F3B3C\">Parcijalna proteza<\/h3><ul style=\"display: flex; flex-direction: column; gap: 12px; color: #2E3836\"><li><span aria-hidden=\"true\" style=\"flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: #9C7641; margin-top: 10px\"><\/span><span>Najjeftinije rešenje<\/span><\/li><li><span aria-hidden=\"true\" style=\"flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: #9C7641; margin-top: 10px\"><\/span><span>Vadi se iz usta i može da se pomera pri jelu i govoru<\/span><\/li><li><span aria-hidden=\"true\" style=\"flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: #9C7641; margin-top: 10px\"><\/span><span>Zahteva posebno održavanje<\/span><\/li><\/ul><\/div>\n<div class=\"cmp rv\" style=\"background: #0F3B3C; color: #F7F3EC; border-color: #0F3B3C; position: relative\"><span style=\"align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: #C8A97E; color: #10201F; padding: 6px 12px; border-radius: 999px\">Preporuka<\/span><h3 style=\"font-size: 30px\">Implant sa krunicom<\/h3><ul style=\"display: flex; flex-direction: column; gap: 12px\"><li><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C8A97E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg><span>Jedino rešenje koje nadoknađuje i koren i vidljivi deo zuba<\/span><\/li><li><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C8A97E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg><span>Ne dira susedne zube<\/span><\/li><li><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C8A97E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg><span>Pomaže da se spreči povlačenje kosti<\/span><\/li><li><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C8A97E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg><span>Uz dobru negu može trajati doživotno<\/span><\/li><\/ul><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section style=\"background: #0F3B3C; color: #F7F3EC; padding: 112px 0\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 64px\">\n<div class=\"rv\" style=\"display: flex; justify-content: space-between; align-items: flex-end; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 720px\">\n<span class=\"eyebrow-l\">Procedura<\/span>\n<h2 style=\"font-size: 54px; line-height: 1.05\">Od pregleda do trajne krunice u 5 koraka<\/h2>\n<\/div>\n<a class=\"btn btn-gold\" href=\"../../../kontakt/\">Zakažite pregled<\/a>\n<\/div>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 28px\">\n<li class=\"rv\" style=\"display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px solid rgba(200,169,126,.55)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 56px; line-height: 1; color: #C8A97E\">01<\/span><h3 style=\"font-size: 24px; line-height: 1.2\">Pregled i planiranje<\/h3><p style=\"font-size: 16.5px; color: rgba(247,243,236,.86)\">Na 3D CBCT snimku procenjujemo kost. Ako je kost dobra, ugradnju odmah zakazujemo; ako nije, prvo radimo augmentaciju ili sinus lift.<\/p><\/li>\n<li class=\"rv\" style=\"display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px solid rgba(200,169,126,.55)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 56px; line-height: 1; color: #C8A97E\">02<\/span><h3 style=\"font-size: 24px; line-height: 1.2\">Ugradnja<\/h3><p style=\"font-size: 16.5px; color: rgba(247,243,236,.86)\">Zahvat traje 20–30 minuta, pod lokalnom anestezijom, pa je obično bez bola.<\/p><\/li>\n<li class=\"rv\" style=\"display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px solid rgba(200,169,126,.55)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 56px; line-height: 1; color: #C8A97E\">03<\/span><h3 style=\"font-size: 24px; line-height: 1.2\">Privremena krunica istog dana<\/h3><p style=\"font-size: 16.5px; color: rgba(247,243,236,.86)\">Ako je implant dovoljno stabilan, istog dana dobijate privremenu krunicu — ne ostajete bez zuba.<\/p><\/li>\n<li class=\"rv\" style=\"display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px solid rgba(200,169,126,.55)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 56px; line-height: 1; color: #C8A97E\">04<\/span><h3 style=\"font-size: 24px; line-height: 1.2\">Zarastanje<\/h3><p style=\"font-size: 16.5px; color: rgba(247,243,236,.86)\">Implant srasta sa kosti 3–4 meseca (Straumann) ili 4–6 meseci (Neodent), uz kontrolne preglede.<\/p><\/li>\n<li class=\"rv\" style=\"display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px solid rgba(200,169,126,.55)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 56px; line-height: 1; color: #C8A97E\">05<\/span><h3 style=\"font-size: 24px; line-height: 1.2\">Trajna krunica<\/h3><p style=\"font-size: 16.5px; color: rgba(247,243,236,.86)\">Uzimamo otisak, a za 7–10 dana postavljamo trajnu krunicu.<\/p><\/li>\n<\/ol>\n<\/div>\n<\/section>\n\n<section style=\"background: #F7F3EC; padding: 120px 0\">\n<div class=\"wrap\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 72px; align-items: center\">\n<div class=\"rv\" style=\"display: flex; flex-direction: column; gap: 20px\">\n<span class=\"eyebrow\">Imedijatna implantacija<\/span>\n<h2 style=\"font-size: 52px; line-height: 1.05; color: #0F3B3C\">Implant odmah nakon vađenja zuba<\/h2>\n<p style=\"font-size: 18px; color: #2E3836\">U određenim slučajevima implant se ugrađuje istog dana kada se zub vadi. To znači manje intervencija i kraće ukupno trajanje terapije.<\/p>\n<p style=\"font-size: 18px; color: #2E3836\">Uslovi su da nema aktivne infekcije i da je kost očuvana. Dr Popović to procenjuje na pregledu — ako ste kandidat, vađenje zuba, ugradnja implanta i privremena krunica obavljaju se u istoj poseti.<\/p>\n<\/div>\n<img src=\"../../../assets/a536f0809575c120724af12f5ed4b502.webp\" alt=\"Nasmejan pacijent — imedijatna implantacija, implant odmah nakon vađenja zuba, poliklinika Dr Popović\" width=\"604\" height=\"575\" loading=\"lazy\" style=\"display: block; width: 100%; height: 520px; border-radius: 28px; object-fit: cover; object-position: 50% 30%\">\n<\/div>\n<\/section>\n\n<section style=\"background: #EFE8DC; padding: 120px 0\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 48px\">\n<div class=\"rv\" style=\"display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; max-width: 820px; margin: 0 auto\">\n<span class=\"eyebrow\">Implanti<\/span>\n<h2 style=\"font-size: 52px; line-height: 1.05; color: #0F3B3C\">Neodent ili Straumann?<\/h2>\n<p style=\"font-size: 18px; color: #2E3836\">Oba implanta dolaze iz Straumann grupe, oba imaju doživotnu garanciju proizvođača i uspešnost preko 98%.<\/p>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: stretch\">\n<div class=\"cmp rv\" style=\"padding: 36px\"><h3 style=\"font-size: 30px; color: #0F3B3C\">Straumann BLT SLActive<\/h3><p style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21px; color: #7A5C33\">Švajcarski premium implant<\/p><p style=\"font-size: 17px; color: #2E3836\">SLActive površina ubrzava zarastanje, pa se trajna krunica postavlja već za 3–4 meseca. Dobar izbor za one koji žele najbrži rezultat ili imaju slabiju kost.<\/p><\/div>\n<div class=\"cmp rv\" style=\"padding: 36px\"><h3 style=\"font-size: 30px; color: #0F3B3C\">Neodent GM Acqua<\/h3><p style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21px; color: #7A5C33\">Odličan odnos cene i kvaliteta<\/p><p style=\"font-size: 17px; color: #2E3836\">Premium kvalitet uz pristupačniju cenu. Zarastanje traje 4–6 meseci.<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section style=\"background: #F7F3EC; padding: 120px 0\">\n<div class=\"wrap\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 72px; align-items: center\">\n<div class=\"rv\" style=\"display: flex; flex-direction: column; gap: 20px\">\n<span class=\"eyebrow\">Više zuba<\/span>\n<h2 style=\"font-size: 52px; line-height: 1.05; color: #0F3B3C\">Nedostaje više zuba?<\/h2>\n<p style=\"font-size: 18px; color: #2E3836\">Za dva susedna zuba obično se ugrađuju dva implanta sa krunicama. Kada nedostaju tri ili četiri zuba zaredom, dva implanta mogu da nose most. Za potpuno bezubu vilicu rešenje je All on 4 ili All on 6.<\/p>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: stretch\">\n<a class=\"tcard rv\" href=\"../all-on-4/\"><h3 style=\"font-size: 30px; color: #0F3B3C\">All on 4<\/h3><p style=\"font-size: 17px; color: #3A4543\">Fiksni zubi za celu vilicu na 4 implanta.<\/p><span class=\"arr\" aria-hidden=\"true\" style=\"margin-top: auto\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidde h<\/span><\/button><button class=\"langopt\" role=\"radio\" aria-checked=\"{{lng.p_de}}\" lang=\"de\" onClick=\"{{lng.set_de}}\" style=\"background: {{lng.bg_de}}; font-weight: {{lng.w_de}}; border: 1px solid rgba(15,59,60,.14)\"><svg width=\"22\" height=\"15\" viewBox=\"0 0 5 3\" preserveAspectRatio=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; border-radius: 3px; box-shadow: 0 0 0 1px rgba(15,59,60,.18)\"><rect width=\"5\" height=\"3\" fill=\"#FFCE00\"><\/rect><rect width=\"5\" height=\"2\" fill=\"#DD0000\"><\/rect><rect width=\"5\" height=\"1\" fill=\"#000000\"><\/rect><\/svg><span>Deutsch<\/span><\/button><button class=\"langopt\" role=\"radio\" aria-checked=\"{{lng.p_ru}}\" lang=\"ru\" onClick=\"{{lng.set_ru}}\" style=\"background: {{lng.bg_ru}}; font-weight: {{lng.w_ru}}; border: 1px solid rgba(15,59,60,.14)\"><svg width=\"22\" height=\"15\" viewBox=\"0 0 3 2\" preserveAspectRatio=\"none\" aria-hidden=\"true\" style=\"flex-shrink: 0; border-radius: 3px; box-shadow: 0 0 0 1px rgba(15,59,60,.18)\"><rect width=\"3\" height=\"2\" fill=\"#D52B1E\"><\/rect><rect width=\"3\" height=\"1.333\" fill=\"#0039A6\"><\/rect><rect width=\"3\" height=\"0.667\" fill=\"#FFFFFF\"><\/rect><\/svg><span>Русский<\/span><\/button><\/div><\/div>\n<\/nav>\n<\/sc-if>\n<\/header>\n\n<section class=\"px\" style=\"background: #F7F3EC; padding-top: 24px; padding-bottom: 48px; display: flex; flex-direction: column; gap: 18px\">\n<nav aria-label=\"Putanja\"><ol class=\"bc\" style=\"font-size: 14px\"><li><a href=\"../../../\">Početna<\/a><\/li><li aria-hidden=\"true\"><span aria-hidden=\"true\" style=\"color: #C8A97E\">/<\/span><\/li><li><a href=\"../../\">Usluge<\/a><\/li><li aria-hidden=\"true\"><span aria-hidden=\"true\" style=\"color: #C8A97E\">/<\/span><\/li><li><a href=\"../\">Zubni implanti<\/a><\/li><li aria-hidden=\"true\"><span aria-hidden=\"true\" style=\"color: #C8A97E\">/<\/span><\/li><li aria-current=\"page\">Jedan zub<\/li><\/ol><\/nav>\n<span class=\"eyebrow\" style=\"margin-top: 8px\">Zubni implanti<\/span>\n<h1 style=\"font-size: 42px; line-height: 1.04; color: #0F3B3C\">Kada nedostaje jedan zub<\/h1>\n<p style=\"font-size: 17px; color: #2E3836\">Nedostatak jednog zuba nije samo estetski problem. Ako se ne reši, susedni zubi počinju da se pomeraju, zagrižaj se menja, a kost na mestu izgubljenog zuba se povlači.<\/p>\n<p style=\"font-size: 17px; color: #2E3836\">Implant sa krunicom nadoknađuje zub u potpunosti, bez diranja zdravih susednih zuba. Ugradnju radi mr sci. med. Nemanja Popović, specijalista oralne hirurgije, sa Straumann i Neodent implantima koji imaju doživotnu garanciju proizvođača. U većini slučajeva privremenu krunicu dobijate istog dana.<\/p>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<a class=\"btn btn-p\" href=\"../../../kontakt/\">Zakažite pregled<\/a>\n<a class=\"btn btn-o\" href=\"tel:+381601111000\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z\"><\/path><\/svg>060 1111 000<\/a>\n<\/div>\n<ul style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<li class=\"badge\"><b>Od 79.200 din sa krunicom<\/b><\/li>\n<li class=\"badge\">Bez brušenja zdravih zuba<\/li>\n<li class=\"badge\">Privremena krunica istog dana<\/li>\n<\/ul>\n<img src=\"../../../assets/00041fbca30d0114febd3b090b46074a.webp\" alt=\"Nedostaje jedan zub — rešenje je implant sa krunicom, poliklinika Dr Popović\" width=\"742\" height=\"400\" style=\"display: block; width: 100%; height: 320px; border-radius: 24px 24px 24px 80px; margin-top: 8px; object-fit: cover; object-position: 40% 50%\">\n<\/section>\n\n<section class=\"px\" style=\"background: #EFE8DC; padding-top: 64px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 16px\">\n<span class=\"eyebrow\">Poređenje rešenja<\/span>\n<h2 style=\"font-size: 34px; line-height: 1.1; color: #0F3B3C\">Zašto je implant najčešće najbolje rešenje?<\/h2>\n<div class=\"cmp rv\" style=\"padding: 24px\"><span style=\"align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #3A4543; padding: 6px 0\">Alternativa<\/span><h3 style=\"font-size: 26px; color: #0F3B3C\">Zubni most<\/h3><ul style=\"display: flex; flex-direction: column; gap: 12px; color: #2E3836\"><li><span aria-hidden=\"true\" style=\"flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: #9C7641; margin-top: 10px\"><\/span><span>Zahteva brušenje dva zdrava susedna zuba<\/span><\/li><li><span aria-hidden=\"true\" style=\"flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: #9C7641; margin-top: 10px\"><\/span><span>Ne sprečava povlačenje kosti, jer nema korena<\/span><\/li><\/ul><\/div>\n<div class=\"cmp rv\" style=\"padding: 24px\"><span style=\"align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #3A4543; padding: 6px 0\">Alternativa<\/span><h3 style=\"font-size: 26px; color: #0F3B3C\">Parcijalna proteza<\/h3><ul style=\"display: flex; flex-direction: column; gap: 12px; color: #2E3836\"><li><span aria-hidden=\"true\" style=\"flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: #9C7641; margin-top: 10px\"><\/span><span>Najjeftinije rešenje<\/span><\/li><li><span aria-hidden=\"true\" style=\"flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: #9C7641; margin-top: 10px\"><\/span><span>Vadi se iz usta i može da se pomera pri jelu i govoru<\/span><\/li><li><span aria-hidden=\"true\" style=\"flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: #9C7641; margin-top: 10px\"><\/span><span>Zahteva posebno održavanje<\/span><\/li><\/ul><\/div>\n<div class=\"cmp rv\" style=\"padding: 24px; background: #0F3B3C; color: #F7F3EC; border-color: #0F3B3C; position: relative\"><span style=\"align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: #C8A97E; color: #10201F; padding: 6px 12px; border-radius: 999px\">Preporuka<\/span><h3 style=\"font-size: 26px\">Implant sa krunicom<\/h3><ul style=\"display: flex; flex-direction: column; gap: 12px\"><li><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C8A97E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg><span>Jedino rešenje koje nadoknađuje i koren i vidljivi deo zuba<\/span><\/li><li><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C8A97E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg><span>Ne dira susedne zube<\/span><\/li><li><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C8A97E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg><span>Pomaže da se spreči povlačenje kosti<\/span><\/li><li><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C8A97E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg><span>Uz dobru negu može trajati doživotno<\/span><\/li><\/ul><\/div>\n<\/section>\n\n<section style=\"background: #0F3B3C; color: #F7F3EC; padding: 64px 20px; display: flex; flex-direction: column; gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\"><span class=\"eyebrow-l\">Procedura<\/span><h2 style=\"font-size: 34px; line-height: 1.1\">Od pregleda do trajne krunice u 5 koraka<\/h2><\/div>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-bottom: 1px solid rgba(200,169,126,.45)\">\n<li class=\"rv\" style=\"display: flex; gap: 18px; padding: 20px 0; border-top: 1px solid rgba(200,169,126,.45)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 40px; line-height: 1; color: #C8A97E; width: 48px; flex-shrink: 0\">01<\/span><div style=\"display: flex; flex-direction: column; gap: 4px\"><h3 style=\"font-size: 22px\">Pregled i planiranje<\/h3><p style=\"font-size: 16.5px; color: rgba(247,243,236,.86)\">Na 3D CBCT snimku procenjujemo kost. Ako je kost dobra, ugradnju odmah zakazujemo; ako nije, prvo radimo augmentaciju ili sinus lift.<\/p><\/div><\/li>\n<li class=\"rv\" style=\"display: flex; gap: 18px; padding: 20px 0; border-top: 1px solid rgba(200,169,126,.45)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 40px; line-height: 1; color: #C8A97E; width: 48px; flex-shrink: 0\">02<\/span><div style=\"display: flex; flex-direction: column; gap: 4px\"><h3 style=\"font-size: 22px\">Ugradnja<\/h3><p style=\"font-size: 16.5px; color: rgba(247,243,236,.86)\">Zahvat traje 20–30 minuta, pod lokalnom anestezijom, pa je obično bez bola.<\/p><\/div><\/li>\n<li class=\"rv\" style=\"display: flex; gap: 18px; padding: 20px 0; border-top: 1px solid rgba(200,169,126,.45)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 40px; line-height: 1; color: #C8A97E; width: 48px; flex-shrink: 0\">03<\/span><div style=\"display: flex; flex-direction: column; gap: 4px\"><h3 style=\"font-size: 22px\">Privremena krunica istog dana<\/h3><p style=\"font-size: 16.5px; color: rgba(247,243,236,.86)\">Ako je implant dovoljno stabilan, istog dana dobijate privremenu krunicu — ne ostajete bez zuba.<\/p><\/div><\/li>\n<li class=\"rv\" style=\"display: flex; gap: 18px; padding: 20px 0; border-top: 1px solid rgba(200,169,126,.45)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 40px; line-height: 1; color: #C8A97E; width: 48px; flex-shrink: 0\">04<\/span><div style=\"display: flex; flex-direction: column; gap: 4px\"><h3 style=\"font-size: 22px\">Zarastanje<\/h3><p style=\"font-size: 16.5px; color: rgba(247,243,236,.86)\">Implant srasta sa kosti 3–4 meseca (Straumann) ili 4–6 meseci (Neodent), uz kontrolne preglede.<\/p><\/div><\/li>\n<li class=\"rv\" style=\"display: flex; gap: 18px; padding: 20px 0; border-top: 1px solid rgba(200,169,126,.45)\"><span style=\"font-family: 'Newsreader', Georgia, serif; font-size: 40px; line-height: 1; color: #C8A97E; width: 48px; flex-shrink: 0\">05<\/span><div style=\"display: flex; flex-direction: column; gap: 4px\"><h3 style=\"font-size: 22px\">Trajna krunica<\/h3><p style=\"font-size: 16.5px; color: rgba(247,243,236,.86)\">Uzimamo otisak, a za 7–10 dana postavljamo trajnu krunicu.<\/p><\/div><\/li>\n<\/ol>\n<a class=\"btn btn-gold\" href=\"../../../kontakt/\">Zakažite pregled<\/a>\n<\/section>\n\n<section class=\"px\" style=\"background: #F7F3EC; padding-top: 64px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 16px\">\n<span class=\"eyebrow\">Imedijatna implantacija<\/span>\n<h2 style=\"font-size: 34px; line-height: 1.1; color: #0F3B3C\">Implant odmah nakon vađenja zuba<\/h2>\n<p style=\"font-size: 17px; color: #2E3836\">U određenim slučajevima implant se ugrađuje istog dana kada se zub vadi. To znači manje intervencija i kraće ukupno trajanje terapije.<\/p>\n<p style=\"font-size: 17px; color: #2E3836\">Uslovi su da nema aktivne infekcije i da je kost očuvana. Dr Popović to procenjuje na pregledu — ako ste kandidat, vađenje zuba, ugradnja implanta i privremena krunica obavljaju se u istoj poseti.<\/p>\n<img src=\"../../../assets/a536f0809575c120724af12f5ed4b502.webp\" alt=\"Nasmejan pacijent — imedijatna implantacija, implant odmah nakon vađenja zuba, poliklinika Dr Popović\" width=\"604\" height=\"575\" loading=\"lazy\" style=\"display: block; width: 100%; height: 280px; border-radius: 22px; margin-top: 8px; object-fit: cover; object-position: 50% 85%\">\n<\/section>\n\n<section class=\"px\" style=\"background: #EFE8DC; padding-top: 64px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 16px\">\n<span class=\"eyebrow\">Implanti<\/span>\n<h2 style=\"font-size: 34px; line-height: 1.1; color: #0F3B3C\">Neodent ili Straumann?<\/h2>\n<p style=\"font-size: 17px; color: #2E3836\">Oba implanta dolaze iz Straumann grupe, oba imaju doživotnu garanciju proizvođača i uspešnost preko 98%.<\/p>\n<div class=\"cmp rv\" style=\"padding: 24px\"><h3 style=\"font-size: 26px; color: #0F3B3C\">Straumann BLT SLActive<\/h3><p style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21px; color: #7A5C33\">Švajcarski premium implant<\/p><p style=\"font-size: 17px; color: #2E3836\">SLActive površina ubrzava zarastanje, pa se trajna krunica postavlja već za 3–4 meseca. Dobar izbor za one koji žele najbrži rezultat ili imaju slabiju kost.<\/p><\/div>\n<div class=\"cmp rv\" style=\"padding: 24px\"><h3 style=\"font-size: 26px; color: #0F3B3C\">Neodent GM Acqua<\/h3><p style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21px; color: #7A5C33\">Odličan odnos cene i kvaliteta<\/p><p style=\"font-size: 17px; color: #2E3836\">Premium kvalitet uz pristupačniju cenu. Zarastanje traje 4–6 meseci.<\/p><\/div>\n<\/section>\n\n<section class=\"px\" style=\"background: #F7F3EC; padding-top: 64px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 16px\">\n<span class=\"eyebrow\">Više zuba<\/span>\n<h2 style=\"font-size: 34px; line-height: 1.1; color: #0F3B3C\">Nedostaje više zuba?<\/h2>\n<p style=\"font-size: 17px; color: #2E3836\">Za dva susedna zuba obično se ugrađuju dva implanta sa krunicama. Kada nedostaju tri ili četiri zuba zaredom, dva implanta mogu da nose most. Za potpuno bezubu vilicu rešenje je All on 4 ili All on 6.<\/p>\n<a class=\"tcard rv\" style=\"padding: 24px\" href=\"../all-on-4/\"><h3 style=\"font-size: 26px; color: #0F3B3C\">All on 4<\/h3><p style=\"font-size: 17px; color: #3A4543\">Fiksni zubi za celu vilicu na 4 implanta.<\/p><span class=\"arr\" aria-hidden=\"true\" style=\"margin-top: auto\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\/path><path d=\"m12 5 7 7-7 7\"><\/path><\/svg><\/span><\/a>\n<a class=\"tcard rv\" style=\"padding: 24px\" href=\"../all-on-6/\"><h3 style=\"font-size: 26px; color: #0F3B3C\">All on 6<\/h3><p style=\"font-size: 17px; color: #3A4543\">Stabilno rešenje za celu vilicu sa 6 implanata.<\/p><span class=\"arr\" aria-hidden=\"true\" style=\"margin-top: auto\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\/path><path d=\"m12 5 7 7-7 7\"><\/path><\/svg><\/span><\/a>\n<\/section>\n\n<section class=\"px\" style=\"background: #0F3B3C; color: #F7F3EC; padding-top: 64px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 16px\">\n<img src=\"../../../assets/27cc3c522ab83bafc001cd117731604a.webp\" alt=\"Mr sci. med. Nemanja Popović, specijalista oralne hirurgije — poliklinika Dr Popović Beograd\" width=\"608\" height=\"603\" loading=\"lazy\" style=\"display: block; width: 100%; height: 360px; object-fit: cover; object-position: 50% 20%; border-radius: 24px; margin-bottom: 8px; background: #E4DBCB\">\n<span class=\"eyebrow-l\">Vaš implantolog<\/span>\n<h2 style=\"font-size: 34px; line-height: 1.1\">Mr sci. med. Nemanja Popović<\/h2>\n<p style=\"font-family: 'Newsreader', Georgia, serif; font-size: 21p
